name: zkPerf CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Verify shared fixture bytes
        run: echo '3a2f191afd465b52ba1db7774c0cf3d02d1ee4f099ea62cd33802ab52293cd75  fixtures/da51_v1.json' | sha256sum --check -
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p zkperf -p zkperf-witness -p zkperf-macros -p cargo-zkperf
      - run: cargo clippy -p zkperf -p zkperf-witness -p zkperf-macros -p cargo-zkperf -- -W warnings
