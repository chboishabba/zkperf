name: zkPerf CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Verify shared fixture bytes
        run: echo 'cc67f109e5be3cfea89d7a8e0ba2b1b6279b5f012d751efbdb7e3a971e957106  fixtures/da51_v1.json' | sha256sum --check -
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p zkperf -p zkperf-witness -p zkperf-macros -p cargo-zkperf
      - run: cargo clippy -p zkperf -p zkperf-witness -p zkperf-macros -p cargo-zkperf -- -W warnings
